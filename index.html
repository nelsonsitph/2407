<div style="font-family: sans-serif; text-align: center;">
  <h2 id="timerDisplay">00:10</h2>
  <button onclick="startTimer()">▶️ 開始倒數 (Start Timer)</button>
</div>

<script>
  let timeLeft = 10;
  let timerId = null;

  function startTimer() {
    if (timerId) clearInterval(timerId);
    timeLeft = 10;
    document.getElementById('timerDisplay').innerText = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
    
    timerId = setInterval(() => {
      timeLeft--;
      document.getElementById('timerDisplay').innerText = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
      if (timeLeft <= 0) {
        clearInterval(timerId);
        alert("⏰ 時間到！ (Time is up!)");
      }
    }, 1000);
  }
</script>
