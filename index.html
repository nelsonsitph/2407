<button onclick="startSTT()" style="padding: 10px; background: #e53935; color: white; border: none; border-radius: 8px;">
  🎤 開始廣東話語音輸入
</button>
<p id="sttResult" style="font-family: sans-serif; margin-top: 10px; font-weight: bold;"></p>

<script>
  function startSTT() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return alert("請使用 Google Chrome 瀏覽器");

    const rec = new SpeechRecognition();
    rec.lang = 'zh-HK';
    rec.onresult = (e) => {
      document.getElementById('sttResult').innerText = "辨識結果：" + e.results[0][0].transcript;
    };
    rec.start();
  }
</script>
