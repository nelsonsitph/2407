<video id="cam" autoplay playsinline style="width: 250px; border-radius: 10px; background: #000;"></video>
<br>
<button onclick="openCam()" style="margin-top: 5px;">📷 開啟鏡頭</button>

<script>
  async function openCam() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      document.getElementById('cam').srcObject = stream;
    } catch (err) {
      alert("鏡頭存取被拒絕（在 Google Sites 嵌入框內會失敗）: " + err);
    }
  }
</script>
