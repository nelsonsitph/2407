<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<video id="v" style="display:none;"></video>
<canvas id="outCvs" width="200" height="150" style="background:#000; border-radius:8px;"></canvas>
<p id="aiStatus">AI 準備中...</p>

<script>
  const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
  hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.5 });
  hands.onResults(res => {
    document.getElementById('aiStatus').innerText = (res.multiHandLandmarks.length > 0) ? "✋ 偵測到手部！" : "🔍 尋找手部中...";
  });
  new Camera(document.getElementById('v'), { onFrame: async () => { await hands.send({ image: document.getElementById('v') }); }, width: 200, height: 150 }).start();
</script>
